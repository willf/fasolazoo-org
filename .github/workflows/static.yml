# Deploy website to GitHub Pages using modern Node/static best practices
name: Deploy site to Pages

env:
  SITE_OUTPUT_DIR: dist

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Node.js
        if: ${{ hashFiles('package.json') != '' }}
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Build site
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p _site

          if [[ -f package.json ]]; then
            echo "Detected package.json: running Node build."

            if [[ -f package-lock.json || -f npm-shrinkwrap.json ]]; then
              npm ci
            else
              npm install --no-fund --no-audit
            fi

            npm run build

            if [[ ! -d "$SITE_OUTPUT_DIR" ]]; then
              echo "::error::Build completed, but output directory '$SITE_OUTPUT_DIR' was not found."
              exit 1
            fi

            echo "Using build output directory: $SITE_OUTPUT_DIR"
            cp -a "$SITE_OUTPUT_DIR"/. _site/
          else
            echo "No package.json found: deploying static files from repository root."
            rsync -av --delete \
              --exclude '.git' \
              --exclude '.github' \
              --exclude '_site' \
              ./ _site/
          fi

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

  deploy:
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
